server:
  port: 8083

spring:
  application:
    name: user-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/user_db}
    username: ${DB_USERNAME:banking_admin}
    password: ${DB_PASSWORD:postgre2188}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis2188}
      timeout: 2s
      connect-timeout: 2s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET:78f2b81005ac23edf307e4368594d68fb1038cc667bc12f5b99946b8ea9e5ccb}
    expiration-ms: 3600000
  notification:
    base-url: http://notification-service
  registration:
    # false = new users are active at once (for automated tests). Keep true otherwise.
    verification-required: true
    verify-url: ${VERIFY_URL:http://localhost:3000/verify.html}
    token-ttl-hours: 24
    min-response-millis: 400
    max-emails-per-address-per-hour: 3