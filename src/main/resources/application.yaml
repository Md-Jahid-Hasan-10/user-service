server:
  port: 8083

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: banking_admin
    password: postgre2188
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
