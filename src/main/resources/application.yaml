server:
  port: 8083

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/user_db}
    username: ${DB_USERNAME:banking_admin}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

app:
  jwt:
    # Must match the Gateway later. At least 32 characters. Use an env var outside local dev.
    secret: ${JWT_SECRET:banking-microservices-local-dev-secret-key-2026}
    expiration-ms: 3600000